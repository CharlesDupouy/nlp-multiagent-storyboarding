# Multi-Agent Storyboarding — Configuration
# Copy this file to configs/config.local.yaml for local overrides.
# Never commit API keys — use environment variables instead.

llm:
  # DeepSeek-compatible base URL (OpenAI-compatible API)
  base_url: "https://api.deepseek.com"
  # api_key: set via DEEPSEEK_API_KEY environment variable

models:
  profiler: "deepseek-chat"               # Phase 1: Fast classification & video selection
  writers_room: "deepseek-reasoner"       # Phase 2: DeepSeek R1 for diverse narrative angles
  director: "deepseek-reasoner"           # Phase 3: DeepSeek R1 for critical pitch evaluation & production notes
  knowledge_retriever: "deepseek-chat"    # Phase 4: Multi-tier factual search query formulation
  retriever: "deepseek-chat"              # Phase 4 alias (backward compatibility)
  art_director: "deepseek-chat"           # Phase 6: Fast physical noun sanitizer & candidate re-ranking
  image_search: "deepseek-chat"           # Phase 6 alias (backward compatibility)
  scriptwriter: "deepseek-reasoner"       # Phase 5 & 7: DeepSeek R1 for sharp, verbatim dialogue

baseline:
  # Model for the single-agent baseline (same model = fair comparison)
  model: "deepseek-chat"

pipeline:
  target_duration_seconds: 60   # target short video length
  max_news_results: 5           # results per search query
  images_per_theme: 2           # images per user theme

output_dir: "outputs/storyboards"
